# docker/nginx-single.conf — used in the combined single-image build.
#
# Differs from nginx.conf in that the API backend is on localhost (not a
# separate Docker network container named "backend").
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow up to 200 MB per request (large model files, SHAP CSVs, etc.)
    client_max_body_size 200M;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to uvicorn running on the same container
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    # Aggressive cache for hashed static assets
    location ~* \.(?:js|css|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache HTML
    location ~* \.html$ {
        add_header Cache-Control "no-store";
    }
}
