name: Release

on:
  push:
    tags:
      - "v*"

# Builds the single combined image and pushes it to GHCR on every version tag.
# Tags produced:
#   ghcr.io/dgtalbug/cerebro:latest
#   ghcr.io/dgtalbug/cerebro:1.2.3
#   ghcr.io/dgtalbug/cerebro:1.2
#
# The image is public — no token required to pull it.
# To build locally: docker build -f docker/Dockerfile -t cerebro .

jobs:
  build-push:
    name: Build & push single image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache via GitHub Actions cache backend — drastically reduces
          # rebuild time for unchanged stages (UI deps, Python deps).
          cache-from: type=gha
          cache-to: type=gha,mode=max
